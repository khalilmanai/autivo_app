name: autivo
description: "Autivo - Smart Vehicle Management & Maintenance Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP Client
  dio: ^5.7.0
  
  # State Management & DI
  provider: ^6.1.2
  get_it: ^8.0.2
  
  # Navigation
  go_router: ^14.6.2
  
  # Secure Storage & Preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  slang: ^4.5.0
  slang_flutter: ^4.5.0
  
  # Auth
  google_sign_in: ^6.2.2
  
  # Utilities
  equatable: ^2.0.5
  flutter_svg: ^2.0.17
  lottie: ^3.1.3
  image_picker: ^1.1.2
  path: ^1.9.0
  json_annotation: ^4.12.0
  
  # Icons
  
  # Platform channels
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.8.0
  build_runner: ^2.4.14
  json_serializable: ^6.8.0
  slang_build_runner: ^4.5.0



flutter:
  uses-material-design: true
  
  assets:
    - assets/lottie/
    - assets/images/